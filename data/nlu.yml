- intent: ask_get_product_description
  examples: |
    - sản phẩm [iPhone 15 Pro Max](product_name) là gì
    - cho mình thông tin con [Laptop Dell XPS 13](product_name)
    - mô tả về [Bàn phím Akko 3068](product_name)
    - [Macbook M3](product_name) dùng tốt không
    - giới thiệu về [Chuột G Pro Superlight](product_name)
    - Cho mình xem thông tin con [Core i9-14900K](product_name)
    - Con [RTX 4090 AORUS Master](product_name) có gì hay không?
    - Mô tả giúp mình cái [Trident Z5 RGB](product_name)
    - Thông số kỹ thuật của [Ryzen 7 7800X3D](product_name) là gì?
    - Cái [NV2 PCIe 4.0](product_name) dùng có tốt không?
    - [Dominator Titanium](product_name) có tính năng gì nổi bật?
    - Cho tôi xem chi tiết về [Chip M4](product_name)
    - Bạn biết gì về [RTX 4060 Ventus 2X](product_name) không?
    - Thông tin chi tiết của [Vengeance LPX DDR4](product_name)
    - [TUF Gaming RTX 4070 Ti](product_name) thông số thế nào?
    - Review giúp mình con [Core Ultra 9 285K](product_name)

- intent: ask_get_product_price_specs
  examples: |
    - mã [SKU-12345](product_bienthe) giá bao nhiêu
    - cấu hình con [DELL-XPS-01](product_bienthe) thế nào
    - xem thông số mã [IP15-PROM-256](product_bienthe)
    - [LOGI-GPRO-BLK](product_bienthe) này bao nhiêu tiền
    - cho xem chi tiết [MSI-G63-55](product_bienthe)

- intent: ask_search_product_by_specs
  examples: |
    - tìm cho mình [laptop](loai_san_pham) [RAM](attribute_name) [16GB](attribute_value)
    - có [bàn phím](loai_san_pham) nào [màu hồng](attribute_value) không
    - kiếm [chuột](loai_san_pham) [Logitech](product_thuonghieu) tầm [500k](attribute_value)
    - [màn hình](loai_san_pham) có [tần số quét](attribute_name) [144Hz](attribute_value)
    - tìm [vga](loai_san_pham) [Nvidia](product_thuonghieu) cấu hình [8GB VRAM](attribute_value)
    - con nào [CPU](attribute_name) [Core i7](attribute_value) không?

- intent: ask_compare_products
  examples: |
    - so sánh mã [SKU-A](product_bienthe) với [SKU-B](product_bienthe)
    - giữa [IP15-PR](product_bienthe) và [IP15-PRM](product_bienthe) con nào tốt hơn
    - đối chiếu thông số [DELL-01](product_bienthe) và [ASUS-02](product_bienthe)
    - mình đang phân vân [MSI-G63](product_bienthe) và [ACER-N5](product_bienthe)
    - so sánh cấu hình 2 mã [GPRO-01](product_bienthe) và [GPRO-02](product_bienthe)

