version: "3.1"

rules:

- rule: Say goodbye anytime the user says goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Say 'I am a bot' anytime the user challenges
  steps:
  - intent: bot_challenge
  - action: utter_iamabot

- rule: Phản hồi khi khách chào hỏi
  steps:
  - intent: greet
  - action: utter_greet

- rule: An ủi khi khách hàng có tâm trạng tệ
  steps:
  - intent: mood_unhappy
  - action: utter_cheer_up
  - action: utter_did_that_help    

- rule: Chia sẻ niềm vui với khách
  steps:
  - intent: mood_great
  - action: utter_happy    

- rule: Yêu cầu khách diễn đạt lại khi không hiểu
  steps:
  - intent: nlu_fallback
  - action: utter_please_rephrase

- rule: Thông báo khi câu hỏi nằm ngoài phạm vi hỗ trợ
  steps:
  - intent: out_of_scope
  - action: utter_out_of_scope   

- rule: Trả lời giá khi khách hỏi
  steps:
  - intent: ask_price
  - action: action_get_product_price   


- rule: Trả lời mô tả sản phẩm khi khách hỏi
  steps:
  - intent: ask_description
  - action: action_get_product_description


- rule: Trả lời số lượng mẫu mã
  steps:
  - intent: ask_product_count
  - action: action_get_product_count

- rule: Hiển thị tất cả mẫu sản phẩm
  steps:
  - intent: ask_all_products
  - action: action_show_all_products

- rule: Đáp lại yêu cầu đếm sản phẩm theo loại
  steps:
  - intent: ask_count_by_type
  - action: action_count_product_by_type

- rule: Hiển thị sản phẩm theo loại
  steps:
  - intent: show_products_by_type
  - action: action_show_products_by_type

- rule: Trả lời về các loại sản phẩm đang có
  steps:
  - intent: ask_all_categories
  - action: action_count_all_types

- rule: Hiển thị danh mục khi khách hỏi
  steps:
    - intent: ask_what_you_sell
    - action: action_list_product_types
    