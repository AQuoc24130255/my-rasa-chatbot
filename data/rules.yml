version: "3.1"

rules:

- rule: Phản hồi khi khách chào hỏi
  steps:
  - intent: greet
  - action: utter_greet

- rule: Say goodbye anytime the user says goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Say 'I am a bot' anytime the user challenges
  steps:
  - intent: bot_challenge
  - action: utter_iamabot

- rule: Yêu cầu khách diễn đạt lại khi không hiểu
  steps:
  - intent: nlu_fallback
  - action: utter_ask_rephrase

- rule: Thông báo khi câu hỏi nằm ngoài phạm vi hỗ trợ
  steps:
  - intent: out_of_scope
  - action: utter_out_of_scope 

# --- LUỒNG TRA CỨU CỬA HÀNG ---

- rule: Hiển thị tổng quan cửa hàng và danh mục
  steps:
  - intent: ask_browse_shop
  - action: action_browse_shop

- rule: Xem danh sách hãng sản xuất theo loại sản phẩm
  steps:
  - intent: ask_show_brand_by_type
  - action: action_show_brand_by_type

- rule: Xem danh sách sản phẩm theo thương hiệu
  steps:
  - intent: ask_show_product_by_brand
  - action: action_show_product_by_brand

# --- LUỒNG CHI TIẾT SẢN PHẨM ---

- rule: Xem mô tả chi tiết sản phẩm
  steps:
  - intent: ask_get_product_description
  - action: action_get_product_description

- rule: Xem giá và cấu hình kỹ thuật cụ thể (SKU)
  steps:
  - intent: ask_get_product_price_specs
  - action: action_get_product_price_specs

# --- LUỒNG TÌM KIẾM NÂNG CAO ---

- rule: Tìm kiếm sản phẩm theo thông số kỹ thuật (RAM, CPU,...)
  steps:
  - intent: ask_search_product_by_specs
  - action: action_search_product_by_specs

- rule: So sánh hai hoặc nhiều sản phẩm
  steps:
  - intent: ask_compare_products
  - action: action_compare_products

- rule: Tìm kiếm sản phẩm tương đương/tương tự
  steps:
  - intent: ask_search_similar_products
  - action: action_search_similar_products

