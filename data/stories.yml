  - intent: ask_show_brand_by_type
  - action: action_show_brand_by_type

- story: khách hỏi sản phẩm không có và chọn quay về danh mục chính
  steps:
  - intent: ask_get_product_price_specs
  - action: action_get_product_price_specs # Action trả về "Không tìm thấy" + Nút bấm Browse
  - intent: ask_browse_shop
  - action: action_browse_shop