  - intent: bot_challenge
  - action: utter_iamabot
  - intent: mood_great
  - action: utter_happy
  - intent: ask_get_product_description
  - action: action_get_product_description
  - intent: goodbye
  - action: utter_goodbye

- story: khách hỏi sản phẩm không có và chọn xem danh sách theo loại (Fallback nội bộ)
