version: "3.1"

stories:

- story: happy path
  steps:
  - intent: greet
  - action: utter_greet
  - intent: mood_great
  - action: utter_happy

- story: sad path 1
  steps:
  - intent: greet
  - action: utter_greet
  - intent: mood_unhappy
  - action: utter_cheer_up
  - action: utter_did_that_help
  - intent: affirm
  - action: utter_happy

- story: sad path 2
  steps:
  - intent: greet
  - action: utter_greet
  - intent: mood_unhappy
  - action: utter_cheer_up
  - action: utter_did_that_help
  - intent: deny
  - action: utter_ask_rephrase

- story: khách hàng buồn
  steps:
  - intent: mood_unhappy
  - action: utter_cheer_up
  - action: utter_did_that_help

- story: khách xác nhận thông tin hữu ích 1
  steps:
  - action: utter_did_that_help
  - intent: affirm
  - action: utter_happy

- story: Xác nhận thông tin hữu ích (General Affirm)
  steps:
  - action: utter_did_that_help
  - intent: affirm
  - action: utter_confirm_received
  - action: utter_happy

- story: khách không hài lòng với câu trả lời
  steps:
  - action: utter_did_that_help
  - intent: deny
  - action: utter_ask_rephrase

- story: Chào hỏi và kết thúc nhanh
  steps:
  - intent: greet
  - action: utter_greet
  - intent: goodbye
  - action: utter_goodbye

- story: khách hỏi giá và hài lòng
  steps:
  - intent: greet
  - action: utter_greet
  - intent: ask_price
  - action: action_get_product_price

- story: khách hỏi giá sau đó hỏi cấu hình
  steps:
    - intent: ask_price
    - action: action_get_product_price
    - intent: ask_specs
    - action: action_get_product_specs


- story: khách hỏi giá sau đó hỏi thêm mô tả chi tiết
  steps:
  - intent: ask_price
  - action: action_get_product_price
  - intent: ask_description
  - action: action_get_product_description
  - intent: goodbye
  - action: utter_goodbye

- story: khách hỏi mô tả nhưng bot không rõ nên hỏi lại
  steps:
  - intent: ask_description
  - action: action_get_product_description
  - intent: deny
  - action: utter_ask_rephrase
  - intent: ask_description
  - action: action_get_product_description

# --- NHÓM KHÁM PHÁ SẢN PHẨM (Discovery) ---

- story: khách muốn xem tất cả sản phẩm shop có
  steps:
  - intent: greet
  - action: utter_greet
  - intent: browse_shop
  - action: action_browse_shop
  - intent: goodbye
  - action: utter_goodbye


# --- NHÓM XỬ LÝ TÌNH HUỐNG NGOẠI LỆ (Edge Cases) ---

- story: khách hỏi linh tinh (ngoài phạm vi) sau đó quay lại hỏi giá
  steps:
  - intent: out_of_scope
  - action: utter_out_of_scope
  - intent: ask_price
  - action: action_get_product_price


- story: khách kiểm tra bot là ai
  steps:
  - intent: bot_challenge
  - action: utter_iamabot
  - intent: greet
  - action: utter_greet

- story: xử lý khi bot không hiểu ý (fallback)
  steps:
  - intent: nlu_fallback
  - action: utter_please_rephrase
  - intent: ask_price
  - action: action_get_product_price
 

# --- LUỒNG 1: TỪ CẢM XÚC SANG MUA SẮM (Chuyển đổi tâm trạng) ---
- story: khách buồn nhưng sau đó muốn xem sản phẩm để giải khuây
  steps:
  - intent: greet
  - action: utter_greet
  - intent: mood_unhappy
  - action: utter_cheer_up
  - action: utter_did_that_help
  - intent: affirm
  - action: utter_happy
  - intent: browse_shop
  - action: action_browse_shop
  - intent: goodbye
  - action: utter_goodbye





# --- LUỒNG 4: SỬA LỖI VÀ QUAY LẠI QUY TRÌNH (Recovery Path) ---
- story: khách hỏi sai bị fallback rồi mới tìm được đúng sản phẩm
  steps:
  - intent: nlu_fallback
  - action: utter_please_rephrase
  - intent: ask_description
  - action: action_get_product_description


# --- LUỒNG 5: HỎI XOÁY ĐÁP XOAY (Kiểm tra năng lực bot) ---
- story: khách hỏi bot là ai rồi mới hỏi giá
  steps:
  - intent: bot_challenge
  - action: utter_iamabot
  - intent: mood_great
  - action: utter_happy
  - intent: ask_price
  - action: action_get_product_price
  - intent: goodbye
  - action: utter_goodbye

- story: khách hỏi sản phẩm lạ và chọn xem danh sách thay thế
  steps:
  - intent: ask_price
  - action: action_get_product_price # Action này sẽ trả về thông báo "Không tìm thấy"
  - intent: show_products_by_type
  - action: action_show_products_by_type

- story: khách hỏi sản phẩm lạ và chọn xem toàn bộ sản phẩm
  steps:
  - intent: ask_price
  - action: action_get_product_price # Action này sẽ trả về thông báo "Không tìm thấy"
  - intent: browse_shop
  - action: action_browse_shop